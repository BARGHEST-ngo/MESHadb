name: Bug report
description: File a bug report for MESHadb
labels: [needs-triage, bug]
body:
  - type: markdown
    attributes:
      value: |
        **MESHadb** gives remote ADB access to Android devices over a peer-to-peer, end-to-end encrypted tunnel built on [MESHnet](https://github.com/BARGHEST-ngo/MESHnet).

        Please check if your bug is [already filed](https://github.com/BARGHEST-ngo/MESHadb/issues) before filing a new one.

        **Note:** For connection or transport issues that are not specific to MESHadb, consider reporting to [MESHnet](https://github.com/BARGHEST-ngo/MESHnet/issues).

        **Do not** paste a session address or PIN. Report security vulnerabilities privately, as described in [SECURITY.md](https://github.com/BARGHEST-ngo/MESHadb/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What is the issue?
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What are the steps you took that hit this issue?
      placeholder: |
        1. Run `pin` and join from the app
        2. Run `adbpair`
        3. See error...
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      description: Which part of MESHadb is having issues?
      multiple: false
      options:
        - meshcli (CLI tool)
        - Joining a session (address / PIN)
        - adbpair (ADB pairing)
        - adbcollect (Forensics collection)
        - adbclean / adbdisable
        - forward / capture (Network forwarding)
        - Android app
        - Connectivity (direct path or relay)
        - Other
    validations:
      required: false
  - type: textarea
    id: changes
    attributes:
      label: Are there any recent changes that introduced the issue?
      description: If so, what are those changes?
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      description: What OS are you using? You may select more than one.
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - Other
    validations:
      required: false
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: What OS version are you using?
      placeholder: e.g., Ubuntu 22.04, macOS Sonoma 14.0, Windows 11
    validations:
      required: false
  - type: input
    id: mesh-version
    attributes:
      label: MESHadb version
      description: Which release or commit of MESHadb (`git describe --tags` in your clone), and which Android app version?
      placeholder: e.g., v0.2.0-alpha, app 0.2.0-alpha
    validations:
      required: false
  - type: textarea
    id: other-software
    attributes:
      label: Other software
      description: What other software (networking, security, ADB tools, etc) are you running?
      placeholder: e.g., ADB version 34.0.5, custom firewall, VPN software
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please paste any relevant log output. This will be automatically formatted as code.
      render: shell
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! We'll look into it as soon as possible.
